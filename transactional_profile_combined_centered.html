<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保険についての調査｜保険プラン提案</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#222}

main{max-width:1100px;margin:25px auto;padding:0 18px}
.grid{display:grid;grid-template-columns:1fr 450px;gap:23px;margin-top:22px}

.chat{height:650px;background:#fff;border:2px solid #cfd7df;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 9px 28px #00000010}
.head{padding:14px 16px;border-bottom:1px solid #e5e8ec;display:flex;align-items:center;gap:10px}
.av,.mini{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:#fff!important;color:#59636f!important;border:1px solid #d9e0e7!important}
.av{width:46px;height:46px}
.mini{width:30px;height:30px;font-size:10px}
.av svg{width:30px;height:30px}
.mini svg{width:20px;height:20px}
.av svg,.mini svg{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.name{font-weight:750}
.role{font-size:12px;color:#78818b;margin-top:3px}

.msgs{flex:1;overflow:auto;padding:17px;background:#fafbfc}
.row{display:flex;gap:8px;align-items:flex-start;margin:11px 0}
.row.me{justify-content:flex-end}
.bubble{max-width:80%;padding:10px 13px;border:2px solid #cbd3dc;background:#fff;border-radius:14px 14px 14px 4px;line-height:1.65;font-size:14px}
.me .bubble{background:#e8f1ff;border-color:#b8cbe3;border-radius:14px 14px 4px 14px}

/* 入力エリア */
.input-container{padding:12px;border-top:1px solid #e4e7eb;display:flex;gap:9px;background:#fff}
.input-container textarea{flex:1;height:48px;resize:none;border:1px solid #cbd2d9;border-radius:10px;padding:10px;font:inherit;font-size:14px}
.input-container button{width:72px;border:0;border-radius:9px;background:#3475c5;color:#fff;font-weight:700;cursor:pointer}
.input-container button:disabled{background:#adb6c0;cursor:not-allowed}

.typing{display:flex;gap:5px;padding:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#8290a0;animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;width:100%}
.choice{border:1px solid #cbd5df;background:#fff;border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer;text-align:left;transition:all .2s;color:#334155}
.choice:hover{background:#f2f6fa;border-color:#3475c5}

.result{display:flex;gap:11px;width:330px;max-width:100%;background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:10px;box-shadow:0 3px 10px #0000000b}
.pic{width:104px;height:82px;border-radius:9px;background:linear-gradient(145deg,#9dc9e8 0 42%,#6fa66e 43% 62%,#e5eef5 63%);position:relative;overflow:hidden;flex:none}
.pic:after{content:"🛡️";position:absolute;right:9px;bottom:7px;font-size:25px}
.rtitle{font-weight:750;font-size:14px;margin:2px 0 5px}
.rtext{font-size:12px;color:#66717d;line-height:1.5}
.link{display:inline-block;margin-top:5px;color:#2769b1;font-size:12px;text-decoration:underline}

/* プロフィールカードスタイル */
.profile-card{background:#fff;border:1px solid #cbd5df;border-radius:12px;padding:14px;width:360px;max-width:100%;box-shadow:0 3px 10px #0000000b}
.profile-title{font-weight:800;font-size:15px;margin-bottom:4px;color:#273849}
.profile-row{padding:10px 0;border-top:1px solid #edf0f3}
.profile-row:first-of-type{border-top:0}
.profile-label{font-size:12px;font-weight:750;color:#56616d;margin-bottom:7px}
.profile-options{display:flex;flex-wrap:wrap;gap:6px}
.profile-opt{border:1px solid #cbd5df;background:#fff;border-radius:16px;padding:6px 11px;font-size:12px;color:#3d4650;cursor:pointer;user-select:none;transition:all .15s}
.profile-opt:hover{background:#f0f4f8}
.profile-opt.selected{background:#e8f1ff;border-color:#3475c5;color:#174f91;font-weight:700;box-shadow:0 0 0 2px #3475c522}
.profile-submit-btn{width:100%;margin-top:12px;padding:10px;border:0;border-radius:8px;background:#3475c5;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.profile-submit-btn:disabled{background:#cbd5df;cursor:not-allowed}

.center-wait{align-self:center;text-align:center;margin:16px auto;color:#5b6470;font-size:15px;line-height:1.6;padding:8px 12px}
.typing-dots{display:block;text-align:center;margin-top:8px;font-size:30px;line-height:1;letter-spacing:4px}
.typing-dots span{display:inline-block;animation:typingDot 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingDot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* 初期画面スタート用オーバーレイ */
.attention-overlay{position:fixed;inset:0;background:rgba(20,28,38,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.attention-modal{width:min(420px,calc(100vw - 40px));background:#fff;border-radius:14px;box-shadow:0 18px 50px #0004;padding:22px;text-align:center}
.attention-modal p{margin:0 0 18px;font-size:15px;line-height:1.6;color:#334155;font-weight:600}
.start-btn{display:inline-block;width:100%;border:0;border-radius:10px;padding:12px 16px;background:#3475c5;color:#fff;font-size:15px;font-weight:700;cursor:pointer}

/* チャットボックス下の終了メッセージ（赤字） */
.end-notice {
  margin-top: 14px;
  padding: 12px 16px;
  background: #fff0f0;
  border: 1px solid #fca5a5;
  border-radius: 10px;
  color: #dc2626;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  line-height: 1.6;
  display: none; /* 初期状態は非表示 */
}

@media(min-width:851px){
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f6f8;
    margin: 0;
  }
  
  main {
    width: 100%;
    height: 100vh;
    max-width: none;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .grid {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    width: 100%;
    height: 100%;
  }

  .chat-wrapper {
    width: 450px;
    max-width: min(450px, calc(100vw - 48px));
    margin: 0 auto;
  }

  .chat {
    width: 100%;
    height: 720px !important;
    max-height: none !important;
  }
}
</style>
</head>
<body>

<main>
  <div class="grid">
    <div class="chat-wrapper">
      <section class="chat">
        <div class="head">
          <div id="topav" class="av"></div>
          <div>
            <div id="nm" class="name"></div>
            <div id="rl" class="role"></div>
          </div>
        </div>
        <div id="msgs" class="msgs"></div>
        
        <!-- テキスト入力欄 -->
        <div class="input-container">
          <textarea id="txt" placeholder="メッセージを入力..." disabled></textarea>
          <button id="send" disabled>送信</button>
        </div>
      </section>

      <!-- チャットボックス下の赤字メッセージ領域 -->
      <div id="chat-end-notice" class="end-notice">
        これで会話は終了です。<br>質問票に戻って回答を続けてください。
      </div>
    </div>
  </div>
</main>

<div id="start-overlay" class="attention-overlay">
  <div class="attention-modal">
    <p>準備ができたら開始ボタンを押してください</p>
    <button id="start-btn" class="start-btn">開始</button>
  </div>
</div>

<script>
const COND = "TRANSACTIONAL";
let run = 0;
let answers = { userName:"", age:"", family:"", currentInsurance:"加入していない", purpose:"", budget:"", health:"" };

const $ = x => document.getElementById(x);
const msgs = $("msgs");
const txt = $("txt");
const sendBtn = $("send");

const AI_ICON = `<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="8" width="18" height="15" rx="4"/><circle cx="12.5" cy="15" r="1.2"/><circle cx="19.5" cy="15" r="1.2"/><circle cx="16" cy="3.5" r="1"/><path d="M7 13H4.5v5H7M25 13h2.5v5H25"/><path d="M13.4 16.8 Q16 19.2 18.6 16.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;

const sleep = m => new Promise(r => setTimeout(r, m));
const MESSAGE_GAP = 500;

function add(t, me = false, type = false) {
  let r = document.createElement("div");
  r.className = "row" + (me ? " me" : "");
  if(!me) {
    let a = document.createElement("div");
    a.className = "mini ai";
    a.innerHTML = AI_ICON;
    r.appendChild(a);
  }
  let b = document.createElement("div");
  b.className = "bubble";
  if(type) b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  else b.innerHTML = t.replace(/\n/g, "<br>");
  r.appendChild(b);
  msgs.appendChild(r);
  msgs.scrollTop = msgs.scrollHeight;
  return r;
}

async function say(t, id) {
  let q = add("", false, true);
  await sleep(800);
  if(id !== run) return false;
  q.remove();
  add(t);
  await sleep(MESSAGE_GAP);
  if(id !== run) return false;
  return true;
}

// ユーザー入力待ち関数
function getUserInput() {
  return new Promise(resolve => {
    txt.disabled = false;
    sendBtn.disabled = false;
    txt.focus();

    const handleSend = () => {
      const val = txt.value.trim();
      if(!val) return;
      
      txt.value = "";
      txt.disabled = true;
      sendBtn.disabled = true;
      sendBtn.removeEventListener("click", handleSend);
      txt.removeEventListener("keydown", handleKey);
      
      add(val, true);
      resolve(val);
    };

    const handleKey = (e) => {
      if(e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };

    sendBtn.addEventListener("click", handleSend);
    txt.addEventListener("keydown", handleKey);
  });
}

// セット用カード描画・選択待ち汎用関数
function showSetCard(title, questions) {
  return new Promise(resolve => {
    let selectedTemp = {};

    let r = document.createElement("div");
    r.className = "row";
    let a = document.createElement("div");
    a.className = "mini ai";
    a.innerHTML = AI_ICON;
    let b = document.createElement("div");
    b.className = "profile-card";
    
    let html = `<div class="profile-title">${title}</div>`;
    questions.forEach(x => {
      html += `<div class="profile-row">
        <div class="profile-label">${x.label}</div>
        <div class="profile-options" data-key="${x.key}">
          ${x.opts.map(o => `<span class="profile-opt" data-value="${o}">${o}</span>`).join('')}
        </div>
      </div>`;
    });
    html += '<button class="profile-submit-btn" disabled>次へ進む</button>';
    b.innerHTML = html;
    r.append(a, b);
    msgs.appendChild(r);
    msgs.scrollTop = msgs.scrollHeight;

    const submitBtn = b.querySelector('.profile-submit-btn');

    b.querySelectorAll('.profile-opt').forEach(opt => {
      opt.onclick = () => {
        const parent = opt.closest('.profile-options');
        const key = parent.dataset.key;
        
        parent.querySelectorAll('.profile-opt').forEach(el => el.classList.remove('selected'));
        opt.classList.add('selected');
        
        selectedTemp[key] = opt.dataset.value;

        if(Object.keys(selectedTemp).length === questions.length) {
          submitBtn.disabled = false;
        }
      };
    });

    submitBtn.onclick = () => {
      Object.assign(answers, selectedTemp);
      submitBtn.textContent = "送信完了";
      submitBtn.disabled = true;
      b.querySelectorAll('.profile-opt').forEach(el => el.style.pointerEvents = 'none');
      resolve();
    };
  });
}

function result() {
  let r = document.createElement("div");
  r.className = "row";
  let a = document.createElement("div");
  a.className = "mini ai";
  a.innerHTML = AI_ICON;
  let wrap = document.createElement("div");
  wrap.innerHTML = `<div style="font-size:14px;margin-bottom:7px">${answers.userName}様、おすすめの保険プランが見つかりました。</div>` +
                   '<div class="result" id="card"><div class="pic"></div><div>' +
                   '<div class="rtitle">トータル医療・生命保障プラン</div>' +
                   '<div class="rtext">病気やケガの入院費と生活習慣病への備えを含む、おすすめの保障プランです。</div>' +
                   '<span class="link">詳細を見る ＞</span></div></div>';
  r.append(a, wrap);
  msgs.appendChild(r);
  msgs.scrollTop = msgs.scrollHeight;
}

// 会話終了通知（チャットボックスの下に赤字表示）
function showAttentionCheck(id) {
  if(id !== run) return;
  const noticeEl = $("chat-end-notice");
  if(noticeEl) {
    noticeEl.style.display = "block";
    noticeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function setup() {
  run++;
  let id = run;
  msgs.innerHTML = "";
  $("chat-end-notice").style.display = "none";

  $("topav").className = "av ai";
  $("topav").innerHTML = AI_ICON;
  $("nm").textContent = "あなたがチャットで相談している相手は「保険エキスパートAI」です。";
  $("rl").textContent = "保険エキスパートAIは、最適な保険を数理的に分析・予測するAIエージェントです。";

  startFlow(id);
}

async function startFlow(id) {
  // 1. 名前の入力
  if(!await say("保険プラン分析を開始します。まず、お名前（またはニックネーム）を入力してください。", id)) return;
  
  answers.userName = await getUserInput();
  
  if(!await say(`${answers.userName}さん、ご入力ありがとうございます。`, id)) return;

  // 2. ２つのセット形式でプロフィール情報を順番に選択
  await showProfileSets(id);

  // 3. 次の会話展開へ
  manipulation(id);
}

// 2問モード（基本属性セット -> 希望条件セット）
async function showProfileSets(id) {
  // 第1問セット：年齢、家族、既往症
  if(!await say("まず、基本属性について選択してください。", id)) return;
  const set1 = [
    { key: "age", label: "年代", opts: ["20代以下", "30代", "40代", "50代以上"] },
    { key: "family", label: "家族構成", opts: ["独身", "夫婦のみ", "配偶者と子供", "その他"] },
    { key: "health", label: "直近5年以内の健康状態・入院歴", opts: ["特に持病・入院歴なし", "持病・持続的な服薬あり", "過去5年以内に入院歴あり"] }
  ];
  await showSetCard("基本属性", set1);

  // 第2問セット：重視したいもの、予算
  if(!await say("ありがとうございます。次に、ご希望のプラン条件について選択してください。", id)) return;
  const set2 = [
    { key: "purpose", label: "最も重視したい備え", opts: ["病気やケガの入院費", "万が一の遺族保障", "がんなどの重い病気", "老後の資金準備"] },
    { key: "budget", label: "月々の予算", opts: ["5,000円未満", "5,000円〜1万円", "1万円〜2万円", "2万円以上"] }
  ];
  await showSetCard("希望条件", set2);
}

async function manipulation(id) {
  if(!await say(`プロフィール情報を登録しました。\n・年代：${answers.age}\n・家族構成：${answers.family}\n・健康状態：${answers.health}\n・保障目的：${answers.purpose}\n・月額予算：${answers.budget}`, id)) return;
  
  // 1. 「生活習慣病の保障は必要ですか？」と問いかけ、ボタン選択を待つ
  if(!await say("生活習慣病の保障は必要ですか？", id)) return;
  
  let diseaseCoverage = await getYesNoChoice(id);
  answers.lifestyleDisease = diseaseCoverage;

  // 2. 「はい」と「いいえ」で回答を分岐
  if (diseaseCoverage === "はい") {
    if(!await say("生活習慣病保障の手厚いプランを優先して検索・評価します。", id)) return;
  } else {
    if(!await say("生活習慣病保障を除外し、月額費用を抑えた基本プランを優先して検索・評価します。", id)) return;
  }

  if(!await say("回答内容をもとに、適合度の高い保険プランを算出します。", id)) return;
  
  // プラン生成アニメーション（5秒待機）
  let w = document.createElement("div");
  w.className = "center-wait";
  w.innerHTML = `${answers.userName}様のための保険プランを作成中です<div class="typing-dots"><span>.</span><span>.</span><span>.</span></div>`;
  msgs.appendChild(w);
  msgs.scrollTop = msgs.scrollHeight;

  await sleep(5000);
  if(id !== run) return;
  w.remove();

  result();
  
  // localStorageへ結果保存
  localStorage.setItem("condition", COND);
  localStorage.setItem("userName", answers.userName);
  localStorage.setItem("age", answers.age);
  localStorage.setItem("family", answers.family);
  localStorage.setItem("health", answers.health);
  localStorage.setItem("purpose", answers.purpose);
  localStorage.setItem("budget", answers.budget);
  localStorage.setItem("lifestyleDisease", answers.lifestyleDisease);

  // キャンペーン・ギフト選択
  if(!await say("キャンペーン：本日保険プランをご成約いただくと、以下の2つのギフトを選んで受け取ることができます。", id)) return;

  await getGiftChoice(id);

  await sleep(2000);
  if(id !== run) return;
  showAttentionCheck(id);
}

// ギフトの選択処理（選択不可・閲覧のみ）
function getGiftChoice(id) {
  return new Promise(resolve => {
    let choiceRow = document.createElement("div");
    choiceRow.className = "row";
    let choiceIcon = document.createElement("div");
    choiceIcon.className = "mini ai";
    choiceIcon.innerHTML = AI_ICON;

    let choiceWrap = document.createElement("div");
    choiceWrap.className = "choices";

    const giftOptions = [
      { text: "本日1,000円分のギフト券を受け取る", val: "gift_today_1000" },
      { text: "1週間後に1,500円分のギフト券を受け取る", val: "gift_week_1500" }
    ];

    giftOptions.forEach(opt => {
      let btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = opt.text;
      
      btn.disabled = true;
      btn.style.cursor = "not-allowed";
      btn.style.opacity = "0.7";
      
      choiceWrap.appendChild(btn);
    });

    choiceRow.append(choiceIcon, choiceWrap);
    msgs.appendChild(choiceRow);
    msgs.scrollTop = msgs.scrollHeight;

    setTimeout(() => {
      resolve();
    }, MESSAGE_GAP);
  });
}

// 「はい」「いいえ」の選択処理
function getYesNoChoice(id) {
  return new Promise(resolve => {
    let choiceRow = document.createElement("div");
    choiceRow.className = "row";
    let choiceIcon = document.createElement("div");
    choiceIcon.className = "mini ai";
    choiceIcon.innerHTML = AI_ICON;

    let choiceWrap = document.createElement("div");
    choiceWrap.className = "choices";
    choiceWrap.style.flexDirection = "row";

    const options = ["はい", "いいえ"];

    options.forEach(opt => {
      let btn = document.createElement("button");
      btn.className = "choice";
      btn.style.padding = "8px 24px";
      btn.style.fontSize = "14px";
      btn.textContent = opt;
      
      btn.onclick = () => {
        choiceWrap.querySelectorAll("button").forEach(b => b.disabled = true);
        add(opt, true);
        resolve(opt);
      };
      
      choiceWrap.appendChild(btn);
    });

    choiceRow.append(choiceIcon, choiceWrap);
    msgs.appendChild(choiceRow);
    msgs.scrollTop = msgs.scrollHeight;
  });
}

$("start-btn").onclick = () => {
  $("start-overlay").style.display = "none";
  setup();
};
</script>
</body>
</html>
